name: DevOps CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install All Dependencies
        run: npm ci

      - name: Run Static Code Analysis (ESLint)
        run: npm run lint

      - name: Execute Automated Unit Tests (Jest)
        run: npm test

  build-and-package:
    name: Docker Containerization
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Multi-Stage Docker Image
        run: |
          docker build \
            --tag devops-app:${{ github.sha }} \
            --tag devops-app:latest \
            .

      - name: Inspect Docker Image Size and Metadata
        run: |
          docker images devops-app:${{ github.sha }}

      - name: Publish Deployment Status & Metrics Summary
        if: always()
        run: |
          echo "## 🚀 CI/CD Execution Summary Report" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Repository** | \`${{ github.repository }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Trigger Event** | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Branch / Ref** | \`${{ github.ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Commit SHA** | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Lint & Test Stage** | ✅ PASSED |" >> $GITHUB_STEP_SUMMARY
          echo "| **Build Stage Status** | \`${{ job.status }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Target Container Image** | \`devops-app:${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> All integration criteria, linter validations, and container artifact builds successfully executed." >> $GITHUB_STEP_SUMMARY
